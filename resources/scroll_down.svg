<svg width="40" height="80" viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <rect x="10" y="10" width="20" height="40" rx="10" ry="10" />
    <circle cx="20" cy="20" r="2">
      <animate
        attributeName="cy"
        values="20;40;40;20;20"
        keyTimes="0;0.3;0.75;0.85;1"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.9 0.1 1 1; 0 0 1 1"
        calcMode="spline"
        dur="5s"
        repeatCount="indefinite" />
    </circle>
  </g>
</svg>
